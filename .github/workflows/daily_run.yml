name: Daily Stock Data Fetcher

on:
  # 手動実行用ボタンを設置
  workflow_dispatch:
  # 定期実行（日本時間の翌朝7時5分）
  schedule:
    - cron: '5 22 * * *'

jobs:
  run_script:
    runs-on: ubuntu-latest
    
    steps:
    # 1. GitHub上のあなたのコード（main.pyなど）をLinux内に引っ張ってくる（超重要）
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Python環境のセットアップ（エラーの原因だった不要なcache設定を削除）
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 必要なライブラリをまとめてインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade pandas yfinance matplotlib openpyxl xlrd pyarrow selenium webdriver-manager

    # 4. Pythonスクリプトを実行（全件バルクダウンロード）
    - name: Run Python script
      run: python main.py

    # 5. 生成されたすべてのデータ（Parquet / CSV）を自動的に GitHub へコミット＆プッシュする
    - name: Commit and Push all stock data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 1. 念のため daily_stock_data.parquet の存在チェック（既存の安全対策を継承）
        if [ -f daily_stock_data.parquet ]; then
          echo "Success: daily_stock_data.parquet found."
          git add daily_stock_data.parquet
        else
          echo "Error: daily_stock_data.parquet not found!"
          exit 1
        fi
        
        # 2. 🔥 新たに jpx_master_raw.csv と data/ フォルダを Git の追跡対象に追加
        if [ -f jpx_master_raw.csv ]; then
          git add jpx_master_raw.csv
        fi
        if [ -d data ]; then
          git add data/
        fi
        
        # 3. 変化がある場合のみコミットしてプッシュ
        # (git diff-index --quiet HEAD || ... の記述で、何か1つでも変更があればコミットします)
        git diff-index --quiet HEAD || git commit -m "Update daily stock data and JPX master [skip ci]"
        git push